<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Внешний гексагон (рамка жетона) -->
  <polygon points="50,3 92,27 92,73 50,97 8,73 8,27" 
           fill="#0a0e0a" 
           stroke="#c9a227" 
           stroke-width="2.5" 
           stroke-linejoin="miter"/>
  
  <!-- Внутренний гексагон (декоративное кольцо) -->
  <polygon points="50,11 85,31 85,69 50,89 15,69 15,31" 
           fill="none" 
           stroke="#c9a227" 
           stroke-width="0.8" 
           opacity="0.35"/>
  
  <!-- Радиационный трилистник -->
  <g fill="#f0c419">
    <!-- Один луч, остальные — поворотом -->
    <path id="szauk-blade" 
          d="M 54 43.07 
             L 65 24.02 
             A 30 30 0 0 0 35 24.02 
             L 46 43.07 
             A 8 8 0 0 1 54 43.07 Z"/>
    <use href="#szauk-blade" transform="rotate(120 50 50)"/>
    <use href="#szauk-blade" transform="rotate(240 50 50)"/>
    
    <!-- Центральная точка -->
    <circle cx="50" cy="50" r="5"/>
  </g>
</svg>